buildscript {
    ext {
        buildToolsVersion = "34.0.0"
        minSdkVersion = 23
        compileSdkVersion = 34
        targetSdkVersion = 34
        ndkVersion = "26.1.10909125"
        kotlinVersion = "1.9.22"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
    }
}

apply plugin: "com.facebook.react.rootproject"

// Some native module dependencies (e.g. react-native-thermal-receipt-
// printer) ship an android/build.gradle hardcoding an old compileSdk
// (29) from whenever they were last published. AGP 8.x refuses to
// compile Java 9+ source below compileSdk 30 ("In order to compile
// Java 9+ source, please set compileSdkVersion to 30 or above"). Force
// every Android library subproject onto this project's own compileSdk/
// buildTools instead of patching node_modules — this also covers any
// other dependency that hits the same wall, not just this one module.
subprojects { subproject ->
    // RNGP's own build-tool module (:gradle-plugin:react-native-gradle-
    // plugin, an included/composite build) is already fully evaluated —
    // and some of its tasks already run — by the time this block
    // executes, since included builds configure earlier than the root
    // project's own build.gradle body. afterEvaluate throws on a project
    // past that point ("Cannot run Project.afterEvaluate(Closure) when
    // the project is already evaluated"), and it's a JVM/Kotlin tooling
    // project with no `android {}` block to override anyway, so skip it.
    if (subproject.state.executed) {
        return
    }
    afterEvaluate {
        if (subproject.plugins.hasPlugin("com.android.library") || subproject.plugins.hasPlugin("com.android.application")) {
            subproject.android {
                compileSdkVersion rootProject.ext.compileSdkVersion
                buildToolsVersion rootProject.ext.buildToolsVersion
            }
        }
    }
}
