appId: org.reactjs.native.example.VanSales
---
# Full salesman workflow, driven against the real backend running on the
# CI runner (seed_demo_data's fixed dataset — see backend/apps/core/
# management/commands/seed_demo_data.py): device PIN setup (RootNavigator
# checks the PIN-unlock gate before the auth check, so this is the actual
# first screen on a fresh install — not login, however natural that
# ordering assumption is), login, home/route list, trip start, an outlet
# check-in, a Spot Billing sale, skip signature, sync. A screenshot is
# taken at every meaningful step so a failure — or a passing run — is
# visually inspectable afterward, not just inferred from assertions.

- launchApp:
    clearState: true
# A cold `clearState: true` launch has to download and parse the full
# ~9MB dev JS bundle from Metro plus initialize WatermelonDB's SQLite
# adapter before anything renders. 30s wasn't enough — the failure
# screenshot at that mark still showed RN's native "Loading from
# Metro..." progress bar, not a crash or wrong screen, just genuinely
# still loading (the x86_64-via-Rosetta simulator build this pod
# constraint requires adds real overhead here). Giving it real headroom
# since it's a one-time cold-start cost, not a per-step cost.
- extendedWaitUntil:
    visible: "Set a device PIN"
    timeout: 90000
- takeScreenshot: 01-first-run-pin-setup

# First run: no device PIN set yet — this is the actual first screen,
# ahead of login (see RootNavigator.tsx's `!isUnlocked` check).
- tapOn: "1"
- tapOn: "2"
- tapOn: "3"
- tapOn: "4"
- takeScreenshot: 02-pin-confirm-step
- tapOn: "1"
- tapOn: "2"
- tapOn: "3"
- tapOn: "4"

# The 4th confirm digit triggers an async Keychain write (setPin) before
# RootNavigator switches away from the PIN gate to the login screen — not
# instant, so wait for the actual next screen rather than assuming it's
# already there.
- extendedWaitUntil:
    visible: "Password"
    timeout: 15000
- takeScreenshot: 03-login-screen
# Username is pre-filled with the demo agent (agent@demo.local) —
# only the password needs entering. Tapping by placeholder *text* only
# selects the element without reliably focusing the underlying
# TextInput's native responder; testID targeting is unambiguous and
# actually focuses it. A short waitForAnimationToEnd after the tap gives
# the keyboard's slide-up animation time to finish before typing starts.
- tapOn:
    id: "password-input"
- waitForAnimationToEnd:
    timeout: 5000
- inputText: "DemoPass123!"
#
# This is the first real *system* keyboard shown all session (the PIN
# pad above is a custom digit grid), and on a fresh simulator iOS
# overlays a one-time "slide your finger across the letters to compose
# a word" swipe-typing tutorial (UIContinuousPathIntroductionView) on
# top of it. Its timing is racy: on some runs it's already up right
# after typing finishes (caught by the first dismiss below); on others
# it doesn't render until *after* the Sign In tap, and then sits on top
# of the home screen blocking every assertion below it — every "Sharma
# General Store" assertion failure investigated so far traces back to
# this, not to the password itself. Screen-hierarchy captured at the
# moment of one such failure confirmed the password field still held
# all 12 bullet characters throughout; the tutorial view was the only
# thing actually wrong on screen. Dismiss it at both points so whichever
# timing shows up this run gets caught.
- tapOn:
    text: "Continue"
    optional: true
- tapOn: "Sign In"
- tapOn:
    text: "Continue"
    optional: true

- takeScreenshot: 04-home-screen
# HomeScreen (src/screens/HomeScreen.tsx) is offline-first: loadData()
# reads the route/beat list purely from local WatermelonDB, and that DB
# starts genuinely empty on this fresh (`clearState: true`) install —
# nothing populates it until synchronize() runs, which only happens on
# an explicit "Sync Now" tap, not on mount. Skipping this step doesn't
# mean the login is broken, it means there's nothing local to show yet
# ("No route assigned. Pull to sync." is the correct empty state, not a
# bug — confirmed by reading the accessibility tree at a failure here on
# 2026-08-12, which showed the real home screen fully loaded around that
# exact message). Sync once before expecting any stop to be visible.
- tapOn: "Sync Now"
# 20s wasn't enough on 2026-08-12: the assertion timed out at 20.5s, but
# the diagnostic screen-hierarchy captured for that same failure showed
# all three stops already correctly populated ("Sharma General Store
# CUST-001...", "City Mart CUST-002...", "Green Valley Supermarket
# CUST-003...") — the pull + local write had genuinely finished by then,
# just a beat after the deadline. Real completion time, not a hung
# request, so headroom is the fix rather than a longer investigation.
- extendedWaitUntil:
    visible: "Sharma General Store"
    timeout: 40000
- assertVisible: "City Mart"
- assertVisible: "Green Valley Supermarket"

- tapOn: "Start Trip"
- takeScreenshot: 05-start-trip-form
- tapOn: "Starting odometer reading"
- inputText: "10500"
- tapOn: "Start Trip"
- takeScreenshot: 06-trip-in-progress

# Check in at the first stop.
- tapOn: "Sharma General Store"
- takeScreenshot: 07-outlet-checked-in

- back
- takeScreenshot: 08-home-with-trip-active

# Spot Billing at the checked-in outlet.
- tapOn: "Sharma General Store"
- takeScreenshot: 09-spot-billing-screen
- tapOn:
    id: "qty-input-SKU-001"
- inputText: "3"
- takeScreenshot: 10-cart-with-item
- tapOn: "Save Invoice"
- takeScreenshot: 11-invoice-saved-signature-step
- tapOn: "Skip signature"
- takeScreenshot: 12-back-on-home

- tapOn: "Sync Now"
- takeScreenshot: 13-synced
