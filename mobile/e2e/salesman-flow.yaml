appId: org.reactjs.native.example.VanSales
---
# Full salesman workflow, driven against the real backend running on the
# CI runner (seed_demo_data's fixed dataset — see backend/apps/core/
# management/commands/seed_demo_data.py): device PIN setup (RootNavigator
# checks the PIN-unlock gate before the auth check, so this is the actual
# first screen on a fresh install — not login, however natural that
# ordering assumption is), login, home/route list, trip start, an outlet
# check-in, a Spot Billing sale, skip signature, sync. A screenshot is
# taken at every meaningful step so a failure — or a passing run — is
# visually inspectable afterward, not just inferred from assertions.

- launchApp:
    clearState: true
# A cold `clearState: true` launch has to download and parse the full
# ~9MB dev JS bundle from Metro plus initialize WatermelonDB's SQLite
# adapter before anything renders. 30s wasn't enough — the failure
# screenshot at that mark still showed RN's native "Loading from
# Metro..." progress bar, not a crash or wrong screen, just genuinely
# still loading (the x86_64-via-Rosetta simulator build this pod
# constraint requires adds real overhead here). Giving it real headroom
# since it's a one-time cold-start cost, not a per-step cost.
- extendedWaitUntil:
    visible: "Set a device PIN"
    timeout: 90000
- takeScreenshot: 01-first-run-pin-setup

# First run: no device PIN set yet — this is the actual first screen,
# ahead of login (see RootNavigator.tsx's `!isUnlocked` check).
- tapOn: "1"
- tapOn: "2"
- tapOn: "3"
- tapOn: "4"
- takeScreenshot: 02-pin-confirm-step
- tapOn: "1"
- tapOn: "2"
- tapOn: "3"
- tapOn: "4"

# The 4th confirm digit triggers an async Keychain write (setPin) before
# RootNavigator switches away from the PIN gate to the login screen — not
# instant, so wait for the actual next screen rather than assuming it's
# already there. 15000ms missed by ~1s on a slower-than-usual runner on
# 2026-08-12 (16.07s actual) — same "real completion time, just needed
# headroom" pattern as the sync wait later in this file, not a hang.
- extendedWaitUntil:
    visible: "Password"
    timeout: 30000
- takeScreenshot: 03-login-screen
# Username is pre-filled with the demo agent (agent@demo.local) —
# only the password needs entering. Tapping by placeholder *text* only
# selects the element without reliably focusing the underlying
# TextInput's native responder; testID targeting is unambiguous and
# actually focuses it. A short waitForAnimationToEnd after the tap gives
# the keyboard's slide-up animation time to finish before typing starts.
- tapOn:
    id: "password-input"
- waitForAnimationToEnd:
    timeout: 5000
- inputText: "DemoPass123!"
#
# This is the first real *system* keyboard shown all session (the PIN
# pad above is a custom digit grid), and on a fresh simulator iOS
# overlays a one-time "slide your finger across the letters to compose
# a word" swipe-typing tutorial (UIContinuousPathIntroductionView) on
# top of it. Its timing is racy: on some runs it's already up right
# after typing finishes (caught by the first dismiss below); on others
# it doesn't render until *after* the Sign In tap, and then sits on top
# of the home screen blocking every assertion below it — every "Sharma
# General Store" assertion failure investigated so far traces back to
# this, not to the password itself. Screen-hierarchy captured at the
# moment of one such failure confirmed the password field still held
# all 12 bullet characters throughout; the tutorial view was the only
# thing actually wrong on screen. Dismiss it at both points so whichever
# timing shows up this run gets caught.
- tapOn:
    text: "Continue"
    optional: true
- tapOn: "Sign In"
- tapOn:
    text: "Continue"
    optional: true

- takeScreenshot: 04-home-screen
# HomeScreen (src/screens/HomeScreen.tsx) is offline-first: loadData()
# reads the route/beat list purely from local WatermelonDB, and that DB
# starts genuinely empty on this fresh (`clearState: true`) install —
# nothing populates it until synchronize() runs, which only happens on
# an explicit "Sync Now" tap, not on mount. Skipping this step doesn't
# mean the login is broken, it means there's nothing local to show yet
# ("No route assigned. Pull to sync." is the correct empty state, not a
# bug — confirmed by reading the accessibility tree at a failure here on
# 2026-08-12, which showed the real home screen fully loaded around that
# exact message). Sync once before expecting any stop to be visible.
- tapOn: "Sync Now"
# The 40s headroom below (raised from an initial 20s that missed by
# half a second) turned out to not be the whole story: a run at the
# full 40s budget still failed, even though its own diagnostic
# screen-hierarchy showed "Sharma General Store CUST-001 · Outstanding
# ₹0" sitting on screen with normal, non-clipped bounds the entire
# time. Each stop's name + code + outstanding balance render as
# separate <Text> siblings inside one TouchableOpacity
# (HomeScreen.tsx), and iOS's accessibility layer merges them into a
# single combined label per card — there is no element whose full
# label is the bare string "Sharma General Store" for a plain-string
# match to land on exactly. Maestro's plain-string matching requires
# matching the *entire* label, not a substring, so it was never going
# to find one — no amount of extra timeout could have fixed this.
# Wildcarding the pattern (`.*X.*`) matches the combined label as a
# genuine substring search regardless of the extra code/balance text
# appended after it.
- extendedWaitUntil:
    visible: ".*Sharma General Store.*"
    timeout: 40000
- assertVisible: ".*City Mart.*"
- assertVisible: ".*Green Valley Supermarket.*"

- tapOn: "Start Trip"
- takeScreenshot: 05-start-trip-form
- tapOn: "Starting odometer reading"
- inputText: "10500"
- tapOn: "Start Trip"
- takeScreenshot: 06-trip-in-progress

# Check in at the first stop. Wildcarded for the same reason as the
# route-list assertions above — the card's accessible label is the
# combined "name · code · outstanding" string, not the bare name.
- tapOn: ".*Sharma General Store.*"
# toggleCheckpoint() (TripScreen.tsx) calls getCurrentLocation() before
# its database.write() — a real GPS/location lookup, not instant on a
# simulator — then reloads. A run on 2026-08-12 showed the row still
# reading "Not visited" in the very next screenshot, taken immediately
# after the tap "completed"; by the time of a later, unrelated failure
# much further into the flow the same row correctly read "Checked in".
# The tap itself was never the problem — wait for the actual result
# before treating the outlet as checked in.
- extendedWaitUntil:
    visible: ".*Sharma General Store.*Checked in.*"
    timeout: 15000
- takeScreenshot: 07-outlet-checked-in

# `back` (Maestro's generic back-press) does not pop this iOS
# navigation stack — verified on 2026-08-12: the flow was still
# reading TripScreen's own "Trip in progress" / per-stop rows tens of
# seconds later, well after `back` ran and reported COMPLETED, with no
# further command ever leaving that screen. React Navigation's default
# iOS header shows the *previous* screen's title as the tappable back
# button — Home's registered title is literally "bpro FieldOps"
# (src/i18n/locales.ts nav.home) — so tap that instead of relying on
# a back gesture Maestro isn't actually driving here.
- tapOn: "bpro FieldOps"
- takeScreenshot: 08-home-with-trip-active

# Spot Billing at the checked-in outlet — same home-screen card as
# above, same merged-label reason for the wildcard.
- tapOn: ".*Sharma General Store.*"
- takeScreenshot: 09-spot-billing-screen
- tapOn:
    id: "qty-input-SKU-001"
- inputText: "3"
- takeScreenshot: 10-cart-with-item
# Three rounds on this one bug on 2026-08-12, worth the full account
# since the fix is easy to accidentally revert to a plausible-looking
# but wrong version:
#   1. KeyboardAvoidingView + FlatList flex:1 in SpotBillingScreen.tsx —
#      "Save Invoice"'s bounds never moved a single pixel, still fully
#      inside the keyboard's own region (which starts at y=561, per the
#      numeric keypad's own "1/2/3" row in the same hierarchy dump).
#      Whatever was fighting the padding was never identified.
#   2. Moved Save Invoice into the FlatList's ListFooterComponent so it
#      shares the list's native scroll-view keyboard handling — bounds
#      *did* move (proving fix 1 truly had zero effect), but downward,
#      not above the keyboard: footer content only scrolls into view
#      automatically for the *focused* responder, and a footer isn't
#      one.
#   3. (this one) Stop trying to keep the button visible above the
#      keyboard at all — tap something else first to blur the qty
#      field and let the keyboard dismiss the normal way, then tap
#      Save Invoice on its natural, unobstructed layout. The customer
#      name header is a stable, always-present, non-scrolling element
#      outside the list entirely, so it's a safe blur target regardless
#      of where the keyboard happens to sit. This much (3) was verified
#      correct — the qty field read a clean, keyboard-free layout with
#      "Save Invoice" fully visible in the very next hierarchy dump.
#   4. waitForAnimationToEnd after the blur tap did NOT fix it: qty came
#      out "38" again, twice, on both the run without this wait and the
#      run with it — the wait genuinely ran its full 5000ms both times
#      (per maestro.log) without the keyboard actually going away.
#      "Save Invoice"'s tap center (≈685) still lines up exactly with
#      the keyboard's "8" key position, meaning the keyboard was still
#      up when Maestro tapped, wait or no wait. Tapping the header text
#      apparently isn't enough to make the qty TextInput resign first
#      responder in the first place — a plain, non-touchable-styled
#      <Text> may just not be claiming the touch the way a real
#      TouchableOpacity/button does, so there was nothing for
#      waitForAnimationToEnd to actually wait *for*.
#   5. (this one) Stop inferring dismissal indirectly and wait for the
#      thing that actually matters: the keyboard's own "1" key no
#      longer being on screen. This is a direct, observable check
#      instead of a timing guess, and works regardless of whether the
#      blur tap itself was ever the right mechanism.
- tapOn: ".*Sharma General Store.*"
- extendedWaitUntil:
    notVisible: "1"
    timeout: 10000
- tapOn: "Save Invoice"
- takeScreenshot: 11-invoice-saved-signature-step
- tapOn: "Skip signature"
- takeScreenshot: 12-back-on-home

- tapOn: "Sync Now"
- takeScreenshot: 13-synced
