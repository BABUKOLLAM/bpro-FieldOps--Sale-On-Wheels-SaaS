<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="violet-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c3b5ff" />
      <stop offset="1" stop-color="#6c53e8" />
    </linearGradient>
    <linearGradient id="violet-grad-diag" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c3b5ff" />
      <stop offset="1" stop-color="#6c53e8" />
    </linearGradient>
  </defs>

  <!-- Flat, full-bleed square — iOS applies its own squircle mask automatically,
       so this must not pre-bake corner rounding (it would double up / show as
       visible corners inside Apple's own mask). -->
  <rect width="100" height="100" fill="#05113b" />

  <circle cx="50" cy="50" r="34" fill="none" stroke="url(#violet-grad-diag)" stroke-width="8.5"
          stroke-dasharray="163 55" stroke-linecap="round" transform="rotate(-46 50 50)" />
  <circle cx="79" cy="27" r="7" fill="#f5a623" />
  <circle cx="50" cy="50" r="21" fill="url(#violet-grad)" />
  <g transform="translate(50 50) scale(0.62) translate(-50 -50)">
    <circle cx="50" cy="43" r="9.5" fill="#05113b" />
    <path d="M29 84 C29 68 38 60 50 60 C62 60 71 68 71 84 Z" fill="#05113b" />
  </g>
</svg>
