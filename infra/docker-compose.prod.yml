# Production compose file for a single-client deployment (one Postgres
# DB, one backend, one domain pair — see docs/PROVISIONING.md for what
# "single-client" means here vs the multi-tenant path apps.tenancy also
# supports). Unlike infra/docker-compose.yml (dev), nothing is bind-
# mounted from the host — every container runs the image exactly as
# built, and nothing except nginx is reachable from outside the host.
#
# Usage: see docs/DEPLOYMENT.md for the full walkthrough. Short version:
#   docker compose -f infra/docker-compose.prod.yml build
#   docker compose -f infra/docker-compose.prod.yml up -d

name: ${COMPOSE_PROJECT_NAME:-fieldops-prod}

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  postgres:
    image: postgres:15
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10
    # No published port — only reachable from other containers on this
    # compose network. Use `docker compose exec postgres psql ...` or
    # infra/backup.sh for direct access.

  redis:
    image: redis:7
    restart: unless-stopped
    logging: *default-logging
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    # No published port, same reasoning as postgres.

  backend:
    image: "${IMAGE_REGISTRY:-}vansales-backend:${IMAGE_TAG:-latest}"
    build:
      context: ../backend
    restart: unless-stopped
    logging: *default-logging
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      POSTGRES_HOST: postgres
      REDIS_URL: redis://redis:6379/0
      REDIS_CACHE_URL: redis://redis:6379/1
    volumes:
      - static-files:/app/staticfiles
      - media-files:/app/media
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # migrate + collectstatic on every start is safe for this app's
    # migration history (additive, already run in sequence throughout
    # development) and keeps a solo-operator deploy to one command. Static
    # files land in the shared volume nginx serves directly (faster than
    # proxying through gunicorn/whitenoise for a VPS this size).
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 60"
    # Probes /healthz/ (DB + Redis round-trip, see apps/core/views.py) —
    # python-based because the slim image ships no curl/wget. start_period
    # covers the migrate+collectstatic phase of the command above.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; r=urllib.request.urlopen('http://localhost:8000/healthz/', timeout=5); sys.exit(0 if r.status==200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    # No published port — nginx proxies to this container's 8000 over the
    # internal compose network.

  celery-worker:
    build:
      context: ../backend
    restart: unless-stopped
    logging: *default-logging
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      POSTGRES_HOST: postgres
      REDIS_URL: redis://redis:6379/0
      REDIS_CACHE_URL: redis://redis:6379/1
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A config worker -l info

  celery-beat:
    build:
      context: ../backend
    restart: unless-stopped
    logging: *default-logging
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      POSTGRES_HOST: postgres
      REDIS_URL: redis://redis:6379/0
      REDIS_CACHE_URL: redis://redis:6379/1
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A config beat -l info

  admin-web:
    image: "${IMAGE_REGISTRY:-}vansales-admin-web:${IMAGE_TAG:-latest}"
    build:
      context: ../admin-web
      dockerfile: Dockerfile.prod
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL}
    restart: unless-stopped
    logging: *default-logging
    environment:
      # Browser-facing API calls that don't go through admin-web's own
      # proxy route hit this URL directly — must be the public API domain.
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL}
      # admin-web's server-side proxy route talks to the backend over the
      # compose network directly, never through the public domain/nginx.
      API_BASE_URL_INTERNAL: http://backend:8000
      # Optional: scope the auth cookies to every subdomain (e.g.
      # ".fieldopspro.in") so one login spans apex/www/app — see
      # admin-web/src/lib/api.ts authCookieOptions. Blank = host-only.
      AUTH_COOKIE_DOMAIN: ${AUTH_COOKIE_DOMAIN:-}
    depends_on:
      - backend
    # No published port — nginx proxies to this container's 3000.

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/vansales.conf:/etc/nginx/conf.d/default.conf:ro
      - static-files:/var/www/static:ro
      - ./nginx/certs:/etc/ssl/certs:ro
      - ./nginx/private:/etc/ssl/private:ro
      - media-files:/var/www/media:ro
      - certbot-etc:/etc/letsencrypt:ro
      - certbot-www:/var/www/certbot:ro
    depends_on:
      - backend
      - admin-web

  # Not a long-running service — run one-off `docker compose ... run
  # certbot ...` commands against this for cert issuance/renewal. See
  # docs/DEPLOYMENT.md.
  certbot:
    image: certbot/certbot
    volumes:
      - certbot-etc:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    entrypoint: "true"

volumes:
  # Named volumes are scoped to this Compose project and never shared with
  # another application's stack.
  postgres-data:
  static-files:
  media-files:
  certbot-etc:
  certbot-www:

networks:
  default:
    name: ${COMPOSE_NETWORK_NAME:-fieldops-prod-network}
    internal: true
