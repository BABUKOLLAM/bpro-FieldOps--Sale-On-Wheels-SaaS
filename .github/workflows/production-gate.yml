name: production-gate

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "admin-web/**"
      - "mobile/**"
      - ".github/workflows/production-gate.yml"
  pull_request:
    paths:
      - "backend/**"
      - "admin-web/**"
      - "mobile/**"
      - ".github/workflows/production-gate.yml"
  workflow_dispatch: {}

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: vansales
          POSTGRES_USER: vansales
          POSTGRES_PASSWORD: vansales
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements/dev.txt
      - name: Install backend deps
        run: pip install -r requirements/base.txt -r requirements/dev.txt
      - name: Production config validation
        run: |
          touch /tmp/production.env
          python scripts/check_production_env.py --env-file /tmp/production.env
        env:
          SECRET_KEY: ci-only-not-a-production-secret
          FIELD_ENCRYPTION_KEY: b142MqNTXKs46wWNs1s02ZIpPmFWhoAAy6P1Hy4AMxU=
          POSTGRES_PASSWORD: ci-only-password
          ALLOWED_HOSTS: api.ci.invalid,backend
          FRONTEND_BASE_URL: https://app.ci.invalid
          NEXT_PUBLIC_API_BASE_URL: https://api.ci.invalid
          CORS_ALLOWED_ORIGINS: https://app.ci.invalid
      - name: Run backend tests
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test
          POSTGRES_HOST: localhost
          FIELD_ENCRYPTION_KEY: b142MqNTXKs46wWNs1s02ZIpPmFWhoAAy6P1Hy4AMxU=
        run: pytest -q tests/test_production_settings.py tests/test_tenancy.py tests/test_password_reset.py

  admin-web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: admin-web/package-lock.json
      - name: Install deps
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Production build
        run: npm run build

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: mobile/package-lock.json
      - name: Install deps
        run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit

  smoke:
    runs-on: ubuntu-latest
    needs: [backend, admin-web, mobile]
    steps:
      - uses: actions/checkout@v4
      - name: Validate deployment docs and scripts exist
        run: |
          test -f infra/deploy-generic.sh
          test -f infra/healthcheck.sh
          test -f infra/rollback.sh
          test -f infra/.env.production.template
          grep -q 'fieldops-prod-network' infra/docker-compose.prod.yml
          ! grep -q 'external: true' infra/docker-compose.prod.yml
          echo "Production deployment artifacts present."
