name: mobile-ios-ci

on:
  push:
    paths: ["mobile/**", "backend/**", ".github/workflows/mobile-ios-ci.yml"]
  pull_request:
    paths: ["mobile/**", "backend/**", ".github/workflows/mobile-ios-ci.yml"]
  workflow_dispatch: {}

env:
  # PrinterSDK's arm64 slice is device-tagged (pre-dates Apple Silicon's
  # arm64-simulator platform tag) — see the Podfile post_install comment.
  # Building the simulator target as x86_64 (via Rosetta) sidesteps it
  # without dropping the pod.
  SIM_ARCH: x86_64
  SIM_DEVICE: "iPhone 15"
  APP_BUNDLE_ID: org.reactjs.native.example.VanSales
  # Same value backend-ci.yml uses for its Postgres-backed test run —
  # a fixed dev-only key, not a real secret.
  FIELD_ENCRYPTION_KEY: b142MqNTXKs46wWNs1s02ZIpPmFWhoAAy6P1Hy4AMxU=

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Xcode version in use
        run: xcodebuild -version

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: mobile/package-lock.json

      - name: Install JS dependencies
        working-directory: mobile
        run: npm ci

      - name: Install CocoaPods
        working-directory: mobile/ios
        run: pod install --repo-update

      # ---------- Tier 1: compile ----------
      - name: Build for iOS Simulator (compile only, no code signing)
        working-directory: mobile/ios
        run: |
          xcodebuild \
            -workspace VanSales.xcworkspace \
            -scheme VanSales \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "platform=iOS Simulator,name=${SIM_DEVICE}" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            ARCHS=${SIM_ARCH} ONLY_ACTIVE_ARCH=NO \
            build

      # ---------- Tier 2: boot, launch, screenshot ----------
      - name: List available simulators (diagnostic)
        if: always()
        run: xcrun simctl list devices available

      - name: Boot Simulator
        run: |
          UDID=$(xcrun simctl create "CI-${SIM_DEVICE// /-}" "$SIM_DEVICE")
          echo "SIM_UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b

      - name: Start Metro bundler
        working-directory: mobile
        run: |
          nohup npx react-native start --port 8081 > /tmp/metro.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:8081/status && break
            sleep 2
          done

      - name: Pre-grant location permission (avoids a blocking system prompt)
        run: xcrun simctl privacy "$SIM_UDID" grant location "$APP_BUNDLE_ID" || true

      - name: Install & launch app
        working-directory: mobile
        run: |
          APP_PATH=$(find ios/build/Build/Products -maxdepth 2 -name "*.app" | head -1)
          echo "App path: $APP_PATH"
          if [ -z "$APP_PATH" ]; then
            echo "No .app found — listing Products tree for diagnosis:"
            find ios/build/Build/Products -maxdepth 3
            exit 1
          fi
          xcrun simctl install "$SIM_UDID" "$APP_PATH"
          xcrun simctl launch "$SIM_UDID" "$APP_BUNDLE_ID"
          sleep 10

      - name: Screenshot launch screen
        working-directory: mobile
        run: |
          mkdir -p artifacts
          xcrun simctl io "$SIM_UDID" screenshot artifacts/tier2-01-launch.png

      # ---------- Tier 3: real backend + automated salesman flow ----------
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements/dev.txt

      - name: Start Postgres + Redis (Homebrew)
        run: |
          brew install postgresql@15 redis
          brew services start postgresql@15
          brew services start redis
          for i in $(seq 1 30); do
            /opt/homebrew/opt/postgresql@15/bin/pg_isready && break
            sleep 2
          done
          /opt/homebrew/opt/postgresql@15/bin/createuser -s vansales || true
          /opt/homebrew/opt/postgresql@15/bin/psql -U vansales -d postgres -c "ALTER USER vansales PASSWORD 'vansales';"
          /opt/homebrew/opt/postgresql@15/bin/createdb -U vansales vansales || true

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements/dev.txt

      - name: Migrate + seed demo data
        working-directory: backend
        env:
          DJANGO_SETTINGS_MODULE: config.settings.dev
          POSTGRES_HOST: localhost
        run: |
          python manage.py migrate
          python manage.py seed_demo_data

      - name: Start Django server
        working-directory: backend
        env:
          DJANGO_SETTINGS_MODULE: config.settings.dev
          POSTGRES_HOST: localhost
        run: |
          nohup python manage.py runserver 0.0.0.0:8000 > /tmp/django.log 2>&1 &
          for i in $(seq 1 30); do
            nc -z localhost 8000 && break
            sleep 2
          done

      - name: Install Maestro
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Run salesman E2E flow
        working-directory: mobile
        run: |
          mkdir -p artifacts/maestro
          "$HOME/.maestro/bin/maestro" test e2e/salesman-flow.yaml \
            --format junit --output artifacts/maestro/results.xml \
            --test-output-dir artifacts/maestro/output

      - name: List Maestro artifacts (diagnostic, always)
        if: always()
        working-directory: mobile
        run: find artifacts/maestro -type f 2>/dev/null || true

      - name: Logs (diagnostic, always)
        if: always()
        run: |
          echo "--- Metro ---"; cat /tmp/metro.log || true
          echo "--- Django ---"; cat /tmp/django.log || true

      - name: Upload screenshots + logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-ci-artifacts
          path: |
            mobile/artifacts/**
            /tmp/metro.log
            /tmp/django.log
          if-no-files-found: warn
