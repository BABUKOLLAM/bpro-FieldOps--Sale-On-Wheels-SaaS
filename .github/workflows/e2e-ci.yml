name: e2e-ci

# End-to-end (Playwright) suite for the console's critical flows — real
# browser -> Next.js -> Django. Runs on changes to either side of that
# boundary, since a regression can originate in either.
on:
  push:
    paths:
      - "admin-web/**"
      - "backend/**"
      - ".github/workflows/e2e-ci.yml"
  pull_request:
    paths:
      - "admin-web/**"
      - "backend/**"
      - ".github/workflows/e2e-ci.yml"
  workflow_dispatch: {}

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: vansales
          POSTGRES_USER: vansales
          POSTGRES_PASSWORD: vansales
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements/dev.txt

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements/dev.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: admin-web/package-lock.json

      - name: Install admin-web dependencies
        working-directory: admin-web
        run: npm ci

      - name: Install Playwright browser
        working-directory: admin-web
        run: npx playwright install --with-deps chromium

      - name: Run E2E suite
        working-directory: admin-web
        # playwright.config.ts boots both servers itself (the backend
        # script recreates its own vansales_e2e database on this same
        # Postgres service; the web server builds + starts admin-web).
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: "5432"
          POSTGRES_USER: vansales
          POSTGRES_PASSWORD: vansales
        run: npm run e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: admin-web/playwright-report/
          retention-days: 7
