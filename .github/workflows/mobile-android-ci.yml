name: mobile-android-ci

on:
  push:
    paths: ["mobile/**", ".github/workflows/mobile-android-ci.yml"]
  pull_request:
    paths: ["mobile/**", ".github/workflows/mobile-android-ci.yml"]
  workflow_dispatch: {}

env:
  APP_ID: com.vansales
  AVD_API_LEVEL: 34

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: mobile/package-lock.json

      - name: Install JS dependencies
        working-directory: mobile
        run: npm ci

      # Cheap gates first — fail in seconds on a type or lint error
      # instead of minutes into the gradle build.
      - name: Typecheck
        working-directory: mobile
        run: npm run typecheck

      - name: Lint
        working-directory: mobile
        run: npm run lint

      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      # android/app/debug.keystore is committed (it's the standard RN
      # placeholder debug key, not a production signing secret) — no
      # separate signing setup needed for a debug-variant build.
      - name: Build debug APK
        working-directory: mobile/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Locate APK
        working-directory: mobile
        run: |
          APK_PATH=$(find android/app/build/outputs/apk/debug -maxdepth 1 -name "*.apk" | head -1)
          echo "APK path: $APK_PATH"
          if [ -z "$APK_PATH" ]; then
            echo "No APK found — listing outputs tree for diagnosis:"
            find android/app/build/outputs -maxdepth 4
            exit 1
          fi
          mkdir -p artifacts
          cp "$APK_PATH" artifacts/bpro-fieldops-debug.apk

      # ---------- Boot, install, launch, screenshot ----------
      # ubuntu-latest GitHub-hosted runners have /dev/kvm available, so the
      # emulator runs hardware-accelerated rather than falling back to
      # (much slower, often CI-timeout-triggering) software rendering.
      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('mobile/android/**/*.gradle*', 'mobile/android/gradle/wrapper/gradle-wrapper.properties') }}

      - name: Start Metro bundler
        working-directory: mobile
        run: |
          nohup npx react-native start --port 8081 > /tmp/metro.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:8081/status && break
            sleep 2
          done

      - name: Boot emulator, install & launch app, screenshot
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ env.AVD_API_LEVEL }}
          target: google_apis
          arch: x86_64
          profile: pixel_5
          # Metro (localhost:8081 on the runner host) is reachable from
          # inside the AVD at 10.0.2.2 — the standard Android emulator
          # host-loopback alias — via `adb reverse`, which forwards the
          # emulator's own localhost:8081 to the host's, so the RN app's
          # dev-mode bundle fetch (which always targets localhost:8081,
          # not 10.0.2.2) resolves correctly without an app code change.
          disable-animations: true
          # Headless + no GPU/audio subsystems: a first pass with default
          # options produced an emulator so resource-starved that even
          # the Pixel Launcher (the emulator's own home screen, not our
          # app) ANR'd — visible in the screenshot, not just inferred.
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot
          # This action runs each line of a multi-line `script:` as its
          # own separate `sh -c` invocation rather than one shell script
          # (confirmed via CI logs: one `[command]/usr/bin/sh -c ...`
          # entry per line) — a multi-line for/do/done loop here fails
          # with "Syntax error: end of file unexpected" because the
          # `done` never reaches the same shell as its `for`. Delegating
          # to a real script file sidesteps that entirely.
          script: bash mobile/scripts/android-ci-verify-launch.sh ${{ env.APP_ID }} mobile/artifacts/bpro-fieldops-debug.apk mobile/artifacts

      - name: Logs (diagnostic, always)
        if: always()
        run: |
          echo "--- Metro ---"; cat /tmp/metro.log || true

      - name: Upload APK + screenshot + logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-android-ci-artifacts
          path: |
            mobile/artifacts/**
            /tmp/metro.log
          if-no-files-found: warn

  # Production-signed release APK — the one to actually distribute.
  # Runs only on pushes to main (not PRs, where fork runs wouldn't have
  # the signing secrets anyway) and skips itself gracefully if the
  # secrets haven't been configured.
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: mobile/package-lock.json

      - name: Install JS dependencies
        working-directory: mobile
        run: npm ci

      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Decode release keystore
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "No ANDROID_RELEASE_KEYSTORE_BASE64 secret configured — skipping release build."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build signed release APK
        if: steps.keystore.outputs.present == 'true'
        working-directory: mobile/android
        env:
          RELEASE_KEYSTORE_FILE: ${{ runner.temp }}/release.keystore
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload signed release APK
        if: steps.keystore.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: bpro-fieldops-release-apk
          path: mobile/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
