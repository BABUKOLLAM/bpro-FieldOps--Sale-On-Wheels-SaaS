name: mobile-android-ci

on:
  push:
    paths: ["mobile/**", ".github/workflows/mobile-android-ci.yml"]
  pull_request:
    paths: ["mobile/**", ".github/workflows/mobile-android-ci.yml"]
  workflow_dispatch: {}

env:
  APP_ID: com.vansales
  AVD_API_LEVEL: 34

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: mobile/package-lock.json

      - name: Install JS dependencies
        working-directory: mobile
        run: npm ci

      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      # android/app/debug.keystore is committed (it's the standard RN
      # placeholder debug key, not a production signing secret) — no
      # separate signing setup needed for a debug-variant build.
      - name: Build debug APK
        working-directory: mobile/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Locate APK
        working-directory: mobile
        run: |
          APK_PATH=$(find android/app/build/outputs/apk/debug -maxdepth 1 -name "*.apk" | head -1)
          echo "APK path: $APK_PATH"
          if [ -z "$APK_PATH" ]; then
            echo "No APK found — listing outputs tree for diagnosis:"
            find android/app/build/outputs -maxdepth 4
            exit 1
          fi
          mkdir -p artifacts
          cp "$APK_PATH" artifacts/bpro-fieldops-debug.apk

      # ---------- Boot, install, launch, screenshot ----------
      # ubuntu-latest GitHub-hosted runners have /dev/kvm available, so the
      # emulator runs hardware-accelerated rather than falling back to
      # (much slower, often CI-timeout-triggering) software rendering.
      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('mobile/android/**/*.gradle*', 'mobile/android/gradle/wrapper/gradle-wrapper.properties') }}

      - name: Start Metro bundler
        working-directory: mobile
        run: |
          nohup npx react-native start --port 8081 > /tmp/metro.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:8081/status && break
            sleep 2
          done

      - name: Boot emulator, install & launch app, screenshot
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ env.AVD_API_LEVEL }}
          target: google_apis
          arch: x86_64
          profile: pixel_5
          # Metro (localhost:8081 on the runner host) is reachable from
          # inside the AVD at 10.0.2.2 — the standard Android emulator
          # host-loopback alias — via `adb reverse`, which forwards the
          # emulator's own localhost:8081 to the host's, so the RN app's
          # dev-mode bundle fetch (which always targets localhost:8081,
          # not 10.0.2.2) resolves correctly without an app code change.
          disable-animations: true
          # Headless + no GPU/audio subsystems: a first pass with default
          # options produced an emulator so resource-starved that even
          # the Pixel Launcher (the emulator's own home screen, not our
          # app) ANR'd — visible in the screenshot, not just inferred.
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot
          script: |
            adb reverse tcp:8081 tcp:8081
            adb install -r mobile/artifacts/bpro-fieldops-debug.apk
            adb shell monkey -p ${{ env.APP_ID }} -c android.intent.category.LAUNCHER 1
            mkdir -p mobile/artifacts

            # A cold debug launch has to download and parse the full JS
            # bundle from Metro before the app renders anything real —
            # a flat 15s sleep here produced a screenshot of the app
            # still at "Bundling 72%..." with the emulator's launcher
            # already ANR'd from the load, while the step still exited 0
            # (nothing in it actually checked readiness). Poll for the
            # app's activity being resumed instead, with a generous
            # ceiling, and fail the step for real if it never gets
            # there — the screenshot + logcat are still captured either
            # way so a timeout leaves visible evidence, not a silent gap.
            READY=0
            for i in $(seq 1 30); do
              sleep 4
              if adb shell dumpsys activity activities 2>/dev/null | grep -q "mResumedActivity.*${{ env.APP_ID }}"; then
                READY=1
                sleep 3
                break
              fi
            done
            echo "App resumed: $READY"
            adb exec-out screencap -p > mobile/artifacts/tier2-01-launch.png
            adb logcat -d > mobile/artifacts/logcat.txt
            if [ "$READY" -ne 1 ]; then
              echo "App never reached a resumed foreground state within the timeout — see tier2-01-launch.png and logcat.txt"
              exit 1
            fi

      - name: Logs (diagnostic, always)
        if: always()
        run: |
          echo "--- Metro ---"; cat /tmp/metro.log || true

      - name: Upload APK + screenshot + logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-android-ci-artifacts
          path: |
            mobile/artifacts/**
            /tmp/metro.log
          if-no-files-found: warn
