name: backend-ci

on:
  push:
    paths: ["backend/**", ".github/workflows/backend-ci.yml"]
  pull_request:
    paths: ["backend/**", ".github/workflows/backend-ci.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: vansales
          POSTGRES_USER: vansales
          POSTGRES_PASSWORD: vansales
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements/dev.txt

      - name: Install dependencies
        # Install base requirements (includes hvac) and dev extras used for tests
        run: pip install -r requirements/base.txt -r requirements/dev.txt

      - name: Start Vault (dev) for settings smoke test
        # Runs a local Vault dev server and injects small example secrets
        run: |
          docker run -d --rm --name vault -e 'VAULT_DEV_ROOT_TOKEN_ID=root' -p 8200:8200 vault:1.14.0 server -dev -dev-root-token-id=root || true
          # wait for vault to be reachable
          for i in $(seq 1 15); do
            if curl -sS http://localhost:8200/v1/sys/health >/dev/null 2>&1; then break; fi
            sleep 1
          done
          echo "VAULT_ADDR=http://localhost:8200" >> $GITHUB_ENV
          echo "VAULT_TOKEN=root" >> $GITHUB_ENV
          # populate minimal secrets for settings to read
          curl -s -X POST -H "X-Vault-Token: root" -d '{"data":{"value":"dummy-secret"}}' http://localhost:8200/v1/secret/data/SECRET_KEY || true
          curl -s -X POST -H "X-Vault-Token: root" -d '{"data":{"value":"b142MqNTXKs46wWNs1s02ZIpPmFWhoAAy6P1Hy4AMxU="}}' http://localhost:8200/v1/secret/data/FIELD_ENCRYPTION_KEY || true

      - name: Django system check
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test
          POSTGRES_HOST: localhost
          FIELD_ENCRYPTION_KEY: b142MqNTXKs46wWNs1s02ZIpPmFWhoAAy6P1Hy4AMxU=
        run: python manage.py check

      - name: Check for missing migrations
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test
          POSTGRES_HOST: localhost
          FIELD_ENCRYPTION_KEY: b142MqNTXKs46wWNs1s02ZIpPmFWhoAAy6P1Hy4AMxU=
        run: python manage.py makemigrations --check --dry-run

      - name: Run tests
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test
          POSTGRES_HOST: localhost
          FIELD_ENCRYPTION_KEY: b142MqNTXKs46wWNs1s02ZIpPmFWhoAAy6P1Hy4AMxU=
        run: python -m pytest -v

      - name: Vault acceptance test
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test
          POSTGRES_HOST: localhost
          FIELD_ENCRYPTION_KEY: b142MqNTXKs46wWNs1s02ZIpPmFWhoAAy6P1Hy4AMxU=
          CI_EXPECTED_SECRET: dummy-secret
        # defaults.run sets working-directory: backend, so invoke the script path relative to that
        run: |
          python scripts/ci_vault_acceptance.py

      - name: Stop Vault (cleanup)
        run: |
          docker stop vault || true

      - name: Dependency vulnerability scan
        # pip-audit checks installed packages against the PyPI advisory
        # DB. Advisory-only for now (|| true would hide regressions;
        # instead known-unfixable findings get --ignore-vuln entries
        # here, so anything NEW still fails the build).
        run: |
          pip install pip-audit
          pip-audit

      - name: Build backend image (load for local scan)
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: false
          load: true
          tags: |
            ghcr.io/${{ github.repository }}/vansales-backend:${{ github.sha }}
            ghcr.io/${{ github.repository }}/vansales-backend:latest

      - name: Build admin-web image (load for local scan)
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        uses: docker/build-push-action@v5
        with:
          context: ./admin-web
          file: ./admin-web/Dockerfile.prod
          push: false
          load: true
          tags: |
            ghcr.io/${{ github.repository }}/vansales-admin-web:${{ github.sha }}
            ghcr.io/${{ github.repository }}/vansales-admin-web:latest

      - name: Trivy scan backend image
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:latest image --exit-code 1 --severity HIGH ghcr.io/${{ github.repository }}/vansales-backend:${{ github.sha }}

      - name: Trivy scan admin-web image
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:latest image --exit-code 1 --severity HIGH ghcr.io/${{ github.repository }}/vansales-admin-web:${{ github.sha }}

      - name: Generate SBOM for backend image
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock anchore/syft:latest ghcr.io/${{ github.repository }}/vansales-backend:${{ github.sha }} -o cyclonedx-json > sbom-backend.json || true

      - name: Upload backend SBOM
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: sbom-backend-${{ github.sha }}
          path: sbom-backend.json

      - name: Generate SBOM for admin-web image
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock anchore/syft:latest ghcr.io/${{ github.repository }}/vansales-admin-web:${{ github.sha }} -o cyclonedx-json > sbom-admin.json || true

      - name: Upload admin-web SBOM
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: sbom-admin-${{ github.sha }}
          path: sbom-admin.json

      - name: Install cosign
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        uses: sigstore/cosign-installer@v3

      - name: Sign backend images with cosign (keyless OIDC)
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        env:
          COSIGN_EXPERIMENTAL: 1
        run: |
          cosign sign --yes ghcr.io/${{ github.repository }}/vansales-backend:${{ github.sha }}
          cosign sign --yes ghcr.io/${{ github.repository }}/vansales-backend:latest

      - name: Sign admin-web images with cosign (keyless OIDC)
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        env:
          COSIGN_EXPERIMENTAL: 1
        run: |
          cosign sign --yes ghcr.io/${{ github.repository }}/vansales-admin-web:${{ github.sha }}
          cosign sign --yes ghcr.io/${{ github.repository }}/vansales-admin-web:latest

      - name: Login to registry
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push backend images
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        run: |
          docker push ghcr.io/${{ github.repository }}/vansales-backend:${{ github.sha }}
          docker push ghcr.io/${{ github.repository }}/vansales-backend:latest

      - name: Push admin-web images
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        run: |
          docker push ghcr.io/${{ github.repository }}/vansales-admin-web:${{ github.sha }}
          docker push ghcr.io/${{ github.repository }}/vansales-admin-web:latest

      - name: Publish image metadata
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        run: |
          echo "IMAGE_REGISTRY=ghcr.io/${GITHUB_REPOSITORY}/" >> $GITHUB_ENV
          echo "IMAGE_TAG=${GITHUB_SHA}" >> $GITHUB_ENV

      - name: Release tag promotion (tagged refs)
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          docker tag ghcr.io/${{ github.repository }}/vansales-backend:${{ github.sha }} ghcr.io/${{ github.repository }}/vansales-backend:${{ github.ref_name }}
          docker push ghcr.io/${{ github.repository }}/vansales-backend:${{ github.ref_name }}
          docker tag ghcr.io/${{ github.repository }}/vansales-admin-web:${{ github.sha }} ghcr.io/${{ github.repository }}/vansales-admin-web:${{ github.ref_name }}
          docker push ghcr.io/${{ github.repository }}/vansales-admin-web:${{ github.ref_name }}
          # Sign the release-tagged images as well
          cosign sign --yes ghcr.io/${{ github.repository }}/vansales-backend:${{ github.ref_name }}
          cosign sign --yes ghcr.io/${{ github.repository }}/vansales-admin-web:${{ github.ref_name }}
        env:
          COSIGN_EXPERIMENTAL: 1

      - name: Create GitHub Release with SBOMs (tagged refs)
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/create-release@v1
        id: create_release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          release_name: Release ${{ github.ref_name }}
          body: |
            **Release**: ${{ github.ref_name }}
            **Commit**: ${{ github.sha }}
            **Images**:
            - `ghcr.io/${{ github.repository }}/vansales-backend:${{ github.ref_name }}`
            - `ghcr.io/${{ github.repository }}/vansales-admin-web:${{ github.ref_name }}`
            
            All images are signed with Sigstore cosign. Verify with:
            ```bash
            cosign verify --certificate-oidc-issuer https://token.actions.githubusercontent.com ghcr.io/${{ github.repository }}/vansales-backend:${{ github.ref_name }}
            cosign verify --certificate-oidc-issuer https://token.actions.githubusercontent.com ghcr.io/${{ github.repository }}/vansales-admin-web:${{ github.ref_name }}
            ```
            
            SBOMs (Software Bill of Materials) are attached to this release for compliance and vulnerability scanning.
          draft: false
          prerelease: false

      - name: Download SBOM artifacts
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/download-artifact@v4
        with:
          path: sboms

      - name: Attach SBOMs to release
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          cd sboms
          for file in */sbom-*.json; do
            # Handle nested directory structure from download-artifact
            if [ -f "$file" ]; then
              echo "Attaching SBOM: $file"
              gh release upload ${{ github.ref_name }} "$file" --clobber
            fi
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

# End of test job steps

  deploy_with_approval:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Using an environment allows GitHub to require manual approval via
    # environment protection rules — configure 'production' in repo settings
    # and require reviewers to force a manual approval before this job runs.
    environment: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to VPS (requires secrets)
        uses: appleboy/ssh-action@v0.1.8
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_SSH_USER }}
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          port: ${{ secrets.VPS_SSH_PORT || '22' }}
          script: |
            set -e
            cd ${{ secrets.VPS_REPO_PATH }}
            echo "IMAGE_REGISTRY=ghcr.io/${{ github.repository }}/" > infra/.env
            echo "IMAGE_TAG=${{ github.sha }}" >> infra/.env
            ./infra/deploy.sh
