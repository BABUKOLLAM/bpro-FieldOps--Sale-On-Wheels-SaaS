name: admin-web-ci

on:
  push:
    paths: ["admin-web/**", ".github/workflows/admin-web-ci.yml"]
  pull_request:
    paths: ["admin-web/**", ".github/workflows/admin-web-ci.yml"]
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: admin-web/package-lock.json

      - name: Install dependencies
        working-directory: admin-web
        run: npm ci

      - name: Lint
        working-directory: admin-web
        run: npm run lint

      # Build BEFORE typecheck: Next generates route/layout helper types
      # (e.g. LayoutProps) into .next/types during the build, and
      # tsconfig includes them — on a fresh checkout tsc fails with
      # "Cannot find name 'LayoutProps'" until they exist. The build is
      # also the stronger gate anyway (Server/Client component
      # violations, invalid route exports).
      - name: Production build
        working-directory: admin-web
        run: npm run build

      - name: Typecheck
        working-directory: admin-web
        run: npm run typecheck

      - name: Dependency vulnerability scan
        working-directory: admin-web
        # Fails the build on any high/critical advisory in the installed
        # tree. Moderate-and-below stay visible in the log without
        # blocking, so upgrades can be batched deliberately.
        run: npm audit --audit-level=high
